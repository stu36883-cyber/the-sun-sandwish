<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sandwichie 🥪💕</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7f4;
  color: #5b4650;
}

header {
  background: linear-gradient(135deg, #ffd9e5, #ffe8c9);
  text-align: center;
  padding: 35px 15px;
  border-radius: 0 0 35px 35px;
}

.logo {
  font-size: 50px;
}

.brand {
  font-size: 38px;
  font-weight: bold;
  color: #c86f8e;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border: 2px solid #f7dce4;
  border-radius: 24px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 7px 20px rgba(200,111,142,0.12);
}

h2 {
  color: #b85f7e;
}

.flavor {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fffafb;
  border: 2px solid #f3e3e8;
  border-radius: 17px;
  padding: 15px;
  margin: 10px 0;
  cursor: pointer;
}

.flavor.selected {
  border-color: #ef9db7;
  background: #fff0f5;
}

.flavor input {
  width: 20px;
  height: 20px;
}

.price-tag {
  background: #ffe0e9;
  color: #b85f7e;
  padding: 6px 10px;
  border-radius: 20px;
  font-weight: bold;
}

.egg {
  background: #fff7df;
  padding: 15px;
  border-radius: 15px;
  margin: 15px 0;
}

.egg input {
  width: 20px;
  height: 20px;
}

.quantity {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 20px 0;
}

.quantity button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #ffd1df;
  color: #a94f70;
  font-size: 24px;
  cursor: pointer;
}

.quantity span {
  font-size: 25px;
  font-weight: bold;
}

.total {
  background: #fff0f5;
  border-radius: 18px;
  padding: 18px;
  text-align: center;
  font-size: 20px;
}

.total strong {
  font-size: 32px;
  color: #c65d80;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 13px;
  margin-top: 6px;
  border: 2px solid #f0e1e6;
  border-radius: 14px;
  font-size: 16px;
}

textarea {
  min-height: 90px;
}

.order-button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 17px;
  background: linear-gradient(135deg, #ee91ad, #d9799a);
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  text-align: center;
  margin-top: 15px;
  color: #55a477;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">🥪💕</div>
  <div class="brand">Sandwichie</div>
  <p>แซนวิชน่ารัก ๆ อร่อยทุกคำ ♡</p>
</header>

<div class="container">

  <div class="card">

    <h2>🌷 เลือกไส้</h2>

    <label class="flavor selected">
      <span>🥓 โบโลน่า</span>
      <span class="price-tag">30 บาท</span>
      <input
        type="radio"
        name="flavor"
        value="โบโลน่า"
        checked
        onchange="selectFlavor(this)"
      >
    </label>

    <label class="flavor">
      <span>🌭 ฮอทดอก</span>
      <span class="price-tag">30 บาท</span>
      <input
        type="radio"
        name="flavor"
        value="ฮอทดอก"
        onchange="selectFlavor(this)"
      >
    </label>

    <label class="flavor">
      <span>🦀 ปูอัดไข่กุ้ง</span>
      <span class="price-tag">30 บาท</span>
      <input
        type="radio"
        name="flavor"
        value="ปูอัดไข่กุ้ง"
        onchange="selectFlavor(this)"
      >
    </label>

    <h2>🥚 เพิ่มไข่ไหม?</h2>

    <label class="egg">
      <input type="checkbox" id="egg" onchange="updateTotal()">
      เพิ่มไข่ <b>+5 บาท / ชิ้น</b>
    </label>

    <h2>🧺 จำนวน</h2>

    <div class="quantity">
      <button onclick="changeQuantity(-1)">−</button>

      <span id="quantity">1</span>

      <button onclick="changeQuantity(1)">+</button>
    </div>

    <div class="total">
      ยอดรวม 💗

      <br>

      <strong>
        <span id="total">30</span> บาท
      </strong>
    </div>

  </div>


  <div class="card">

    <h2>💌 ข้อมูลสำหรับสั่งซื้อ</h2>

    <label>ชื่อลูกค้า</label>

    <input
      type="text"
      id="customerName"
      placeholder="เช่น น้องมายด์"
    >

    <label>ช่องทางการติดต่อ</label>

    <input
      type="text"
      id="contact"
      placeholder="LINE / Facebook / เบอร์โทร"
    >

    <label>หมายเหตุ</label>

    <textarea
      id="note"
      placeholder="เช่น รับของตอนพักกลางวัน 💕"
    ></textarea>

    <button
      class="order-button"
      onclick="submitOrder()"
    >
      💗 สั่งแซนวิชเลย!
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </div>

</div>


<script>

let quantity = 1;

let selectedFlavor = "โบโลน่า";


function selectFlavor(radio) {

  selectedFlavor = radio.value;

  document.querySelectorAll(".flavor").forEach(function(item) {

    item.classList.remove("selected");

  });

  radio.parentElement.classList.add("selected");

  updateTotal();
}


function changeQuantity(number) {

  quantity += number;

  if (quantity < 1) {
    quantity = 1;
  }

  document.getElementById("quantity").innerText = quantity;

  updateTotal();
}


function updateTotal() {

  let price = 30;

  let egg = document.getElementById("egg").checked;

  if (egg) {

    price += 5;

  }

  let total = price * quantity;

  document.getElementById("total").innerText = total;

}


function submitOrder() {

  let name =
    document.getElementById("customerName").value.trim();

  let contact =
    document.getElementById("contact").value.trim();

  let note =
    document.getElementById("note").value.trim();

  if (name === "") {

    alert("💕 กรุณากรอกชื่อลูกค้าก่อนนะคะ");

    return;

  }

  let egg =
    document.getElementById("egg").checked;

  let total =
    document.getElementById("total").innerText;

  document.getElementById("message").innerText =
    "✨ รับออเดอร์ทดลองแล้ว! " +
    selectedFlavor +
    " × " +
    quantity +
    " ชิ้น = " +
    total +
    " บาท 🥪💗";

}

</script>

</body>
</html>
