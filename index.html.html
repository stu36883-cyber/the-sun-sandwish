<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandwichie 🥪</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:Mali,Arial,sans-serif;background:#fff7f4;color:#5b4650}
header{background:linear-gradient(135deg,#ffd9e5,#ffe8c9);padding:34px 18px 28px;text-align:center;border-radius:0 0 35px 35px}
.logo{font-size:48px}.brand{font-family:Itim,cursive;font-size:38px;color:#c86f8e;margin:2px 0}
header p{margin:5px 0;color:#856d76}
.wrap{max-width:720px;margin:22px auto;padding:0 15px}
.card{background:#fff;border:2px solid #f7dce4;border-radius:24px;padding:20px;margin-bottom:17px;box-shadow:0 7px 20px #d68da51c}
h2{font-family:Itim,cursive;color:#b85f7e;font-size:26px;margin:0 0 15px}
.flavors{display:grid;gap:11px}
.flavor{background:#fffafb;border:2px solid #f3e3e8;border-radius:17px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.15s}
.flavor.selected{border-color:#ef9db7;background:#fff0f5;transform:translateY(-1px);box-shadow:0 5px 12px #ef9db733}
.flavor input{accent-color:#e889a8;width:18px;height:18px}
.badge{background:#ffe0e9;color:#b85f7e;border-radius:99px;padding:5px 10px;font-weight:700}
.check{display:flex;align-items:center;gap:10px;background:#fff7df;padding:13px 14px;border-radius:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#e889a8}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 16px}
.qty button{width:42px;height:42px;border:0;border-radius:50%;background:#ffd1df;color:#a94f70;font-size:23px;font-weight:bold;cursor:pointer}
.qty strong{font-size:24px;min-width:35px;text-align:center}
.price{background:#fff0f5;border-radius:18px;padding:15px;text-align:center;font-weight:700}
.price span{font-size:31px;color:#c65d80}
label.field{display:block;font-weight:700;margin:12px 0 5px;color:#755a65}
input[type=text],textarea{width:100%;padding:13px 14px;border:2px solid #f0e1e6;border-radius:14px;font:inherit;outline:none;background:#fffdfd}
input[type=text]:focus,textarea:focus{border-color:#efa4bb}
textarea{min-height:80px;resize:vertical}
.order{width:100%;padding:15px;border:0;border-radius:17px;background:linear-gradient(135deg,#ee91ad,#d9799a);color:#fff;font:700 19px Mali;cursor:pointer;box-shadow:0 6px 14px #d9799a35}
.order:active{transform:scale(.98)}
#msg{text-align:center;font-weight:700;color:#55a477;margin-top:13px}
.note{text-align:center;color:#9b858e;font-size:12px;margin:12px 0 0}
.heart{color:#e889a8}
</style>
</head>
<body>
<header>
<div class="logo">🥪💕</div>
<div class="brand">Sandwichie</div>
<p>แซนวิชน่ารัก ๆ อร่อยทุกคำ ♡</p>
</header>

<div class="wrap">
<section class="card">
<h2>🌷 เลือกไส้ที่ชอบ</h2>
<div class="flavors">
<label class="flavor selected" id="f0"><span>🥓 โบโลน่า</span><span class="badge">30 ฿</span><input type="radio" name="flavor" checked onchange="pick(0)"></label>
<label class="flavor" id="f1"><span>🌭 ฮอทดอก</span><span class="badge">30 ฿</span><input type="radio" name="flavor" onchange="pick(1)"></label>
<label class="flavor" id="f2"><span>🦀 ปูอัดไข่กุ้ง</span><span class="badge">30 ฿</span><input type="radio" name="flavor" onchange="pick(2)"></label>
</div>

<h2 style="margin-top:22px">🥚 อยากเพิ่มไข่ไหม?</h2>
<label class="check"><input id="egg" type="checkbox" onchange="render()"> เพิ่มไข่ <b>+5 บาท / ชิ้น</b></label>

<h2 style="margin-top:22px">🧺 จำนวน</h2>
<div class="qty"><button onclick="change(-1)">−</button><strong id="qty">1</strong><button onclick="change(1)">+</button></div>
<div class="price">ยอดรวม <span id="total">30</span> บาท <span class="heart">♥</span></div>
</section>

<section class="card">
<h2>💌 ข้อมูลสำหรับสั่งซื้อ</h2>
<label class="field">ชื่อเล่น / ชื่อลูกค้า</label>
<input id="name" type="text" placeholder="เช่น น้องมายด์">

<label class="field">ช่องทางการติดต่อ</label>
<input id="contact" type="text" placeholder="LINE / Facebook / เบอร์โทร">

<label class="field">หมายเหตุ</label>
<textarea id="note" placeholder="เช่น ขอรับตอนพักกลางวันนะคะ 💕"></textarea>

<button class="order" onclick="order()">💗 สั่งแซนวิชเลย!</button>
<div id="msg"></div>
<p class="note">เว็บทดลองนะคะ • ตอนนี้ยังไม่ได้ส่งข้อมูลเข้า Google Sheets</p>
</section>
</div>

<script>
let qty=1,selected=0,flavors=['โบโลน่า','ฮอทดอก','ปูอัดไข่กุ้ง'];
function pick(i){selected=i;render()}
function change(n){qty=Math.max(1,qty+n);render()}
function render(){
 document.getElementById('qty').textContent=qty;
 const egg=document.getElementById('egg').checked;
 document.getElementById('total').textContent=qty*(30+(egg?5:0));
 for(let i=0;i<3;i++)document.getElementById('f'+i).classList.toggle('selected',i===selected);
}
function order(){
 const name=document.getElementById('name').value.trim();
 if(!name)return alert('น้อง ๆ อย่าลืมใส่ชื่อนะคะ 💕');
 document.getElementById('msg').textContent='✨ รับออเดอร์ทดลองแล้ว ขอบคุณที่อุดหนุนนะคะ! 🥪💗';
}
render();
</script>
</body>
</html>
